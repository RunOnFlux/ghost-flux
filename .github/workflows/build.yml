name: Test, build and publish

# Publishing :latest reaches running sites: FluxOS checks every app's tag every six hours and
# soft-redeploys onto a new image (Ghost then runs its migrations at start). So the image is tested
# before it is pushed, and a pull request only tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: runonflux/ghost-flux

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test tests/lib.test.js
      - name: Version is a version
        run: grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' VERSION

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Version and base
        run: |
          echo "VERSION=$(tr -d '[:space:]' <VERSION)" >>"$GITHUB_ENV"
          base="$(sed -n 's/^ARG BASE_IMAGE=//p' Dockerfile)"
          echo "BASE_DIGEST=$(docker buildx imagetools inspect "$base" --format '{{json .Manifest}}' | jq -r .digest)" >>"$GITHUB_ENV"
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghost-flux:ci
          build-args: |
            FLUX_IMAGE_VERSION=${{ env.VERSION }}
            BASE_DIGEST=${{ env.BASE_DIGEST }}
            REVISION=${{ github.sha }}
      - name: Image test (MySQL 8.3.0, first boot, CLI)
        run: |
          docker network create t
          docker run -d --name db --network t -e MYSQL_ROOT_PASSWORD=Ci_pw_123456 mysql:8.3.0 --disable-log-bin
          docker run -d --name g --network t -p 8080:2368 -e url=https://ci.example.test \
            -e database__connection__host=db -e database__connection__port=3306 \
            -e database__connection__password=Ci_pw_123456 ghost-flux:ci
          for i in $(seq 1 100); do
            c=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: ci.example.test' http://localhost:8080/) || true
            [ "$c" = 200 ] && break; sleep 3
          done
          docker logs g | tail -30
          [ "$c" = 200 ]
          docker exec g flux-ghost info | jq -e '.ok and .data.database.reachable'
          docker exec g flux-ghost db export | jq -e '.ok'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the tested image
        if: github.event_name != 'pull_request'
        run: |
          # ghost-<version>: which Ghost an image carries, read by `flux-ghost update check`.
          ghost="$(docker run --rm --entrypoint printenv ghost-flux:ci GHOST_VERSION)"
          for t in latest "${VERSION}" "ghost-${ghost}"; do
            docker tag ghost-flux:ci "${IMAGE_NAME}:${t}"
            docker push "${IMAGE_NAME}:${t}"
          done
