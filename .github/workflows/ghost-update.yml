name: Follow Ghost releases

# Ghost releases about every week, security fixes included. This checks the official image for a
# newer 6.x and OPENS A PULL REQUEST that moves BASE_IMAGE and bumps VERSION; it never publishes.
# Merging is the decision, because publishing :latest restarts every site on it (FluxOS soft-
# redeploys onto a new digest within six hours, and Ghost runs its migrations at that start).
# A pull request opened with GITHUB_TOKEN starts no workflow, so this starts build.yml on its branch
# (tests and the image test; only main publishes).
#
# Two slots on the same day, off the full hour: GitHub delays or drops scheduled runs under load, and
# a dropped single slot would mean a week without a check. The second finds nothing to do, or only
# refreshes the open pull request.

on:
  schedule:
    - cron: '17 6 * * 2'
    - cron: '43 13 * * 2'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: versions
        run: |
          current="$(sed -n 's/^ARG BASE_IMAGE=ghost:\([0-9.]*\)-alpine$/\1/p' Dockerfile)"
          [ -n "$current" ] || { echo "::error::BASE_IMAGE is not ghost:<x.y.z>-alpine"; exit 1; }
          major="${current%%.*}"
          # The newest x.y.z-alpine tag of the same major version (a new major is a manual move).
          latest="$(curl -fsS "https://hub.docker.com/v2/repositories/library/ghost/tags?page_size=100&name=-alpine" \
            | jq -r '.results[].name' | grep -E "^${major}\.[0-9]+\.[0-9]+-alpine$" | sed 's/-alpine$//' | sort -V | tail -1)"
          echo "current=${current}" >>"$GITHUB_OUTPUT"
          echo "latest=${latest}" >>"$GITHUB_OUTPUT"
          echo "current ${current}, latest ${latest}"

      - name: Move to the new Ghost
        if: steps.versions.outputs.latest != '' && steps.versions.outputs.latest != steps.versions.outputs.current
        env:
          CUR: ${{ steps.versions.outputs.current }}
          NEW: ${{ steps.versions.outputs.latest }}
        run: |
          sed -i "s/^ARG BASE_IMAGE=ghost:${CUR}-alpine$/ARG BASE_IMAGE=ghost:${NEW}-alpine/" Dockerfile
          v="$(tr -d '[:space:]' <VERSION)"; IFS=. read -r a b c <<<"$v"; next="${a}.${b}.$((c + 1))"
          echo "$next" >VERSION
          sed -i "/^## Versions$/a\\
          \\
          - ${next}: Ghost ${NEW} (from ${CUR}). Release notes: https://github.com/TryGhost/Ghost/releases/tag/v${NEW}" README.md

      - id: pr
        uses: peter-evans/create-pull-request@v7
        if: steps.versions.outputs.latest != '' && steps.versions.outputs.latest != steps.versions.outputs.current
        with:
          branch: ghost-${{ steps.versions.outputs.latest }}
          title: Ghost ${{ steps.versions.outputs.latest }}
          commit-message: Ghost ${{ steps.versions.outputs.latest }}
          body: |
            Moves the base image from Ghost ${{ steps.versions.outputs.current }} to ${{ steps.versions.outputs.latest }}.

            Release notes: https://github.com/TryGhost/Ghost/releases/tag/v${{ steps.versions.outputs.latest }}

            Merging publishes `:latest`, and every Ghost site on Flux moves to it within six hours
            (FluxOS soft redeploy, data kept; Ghost runs its migrations at that start).

      - name: Test the pull request's branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.pull-request-branch }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
